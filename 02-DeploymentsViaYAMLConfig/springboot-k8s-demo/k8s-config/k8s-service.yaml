apiVersion: v1
kind: Service
metadata:
  name: springboot-k8s-svc
spec:
  selector:
    app: springboot-k8s # This should be same as the deployment selector --> spec.selector.matchLabels.app
  ports:
  - protocol: TCP
    port: 8080          # The port the service is running in the cluster
    targetPort: 8080    # The port exposed by the service
  type: NodePort
